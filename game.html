<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f0ff">
  <meta name="description" content="Vocab Puzzles — a friendly Korean vocabulary quest game.">
  <title>Vocab Puzzles — Korean Vocabulary Quest</title>
  <style>
    :root {
      --purple: #7555d9;
      --purple-dark: #5136ad;
      --purple-soft: #eee7ff;
      --purple-pale: #f8f5ff;
      --ink: #28233d;
      --muted: #77718b;
      --line: #e9e3f5;
      --white: #ffffff;
      --green: #218b69;
      --green-soft: #e6f8f0;
      --red: #bd4e68;
      --red-soft: #fff0f3;
      --amber: #b7791f;
      --amber-soft: #fff7df;
      --shadow: 0 18px 50px rgba(71, 48, 129, .09);
      --radius-xl: 26px;
      --radius-lg: 19px;
      --radius-md: 13px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(221, 206, 255, .48), transparent 27rem),
        radial-gradient(circle at 95% 23%, rgba(214, 241, 234, .42), transparent 24rem),
        #fbfaff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #b9a5ff; outline-offset: 3px; }
    .site-header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      max-width: 1240px; margin: 0 auto; padding: 22px 26px 10px;
    }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
    .brand-mark {
      display: grid; place-items: center; width: 45px; height: 45px; border-radius: 15px;
      color: white; font-size: 23px; font-weight: 900;
      background: linear-gradient(145deg, #9b80f4, #6c4bcf);
      box-shadow: 0 8px 20px rgba(117, 85, 217, .27);
    }
    .brand-name { font-weight: 850; font-size: 18px; letter-spacing: -.4px; }
    .brand-sub { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .sound-toggle {
      display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 9px 13px;
      border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.9);
      color: var(--ink); font-weight: 750; font-size: 13px; cursor: pointer; transition: .2s ease;
    }
    .sound-toggle:hover { border-color: #c8b8f3; transform: translateY(-1px); }
    .sound-icon { font-size: 16px; }
    .page-shell { max-width: 1240px; margin: 0 auto; padding: 18px 26px 62px; }
    .panel {
      background: rgba(255,255,255,.94); border: 1px solid rgba(232,225,246,.9);
      border-radius: var(--radius-xl); box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 7px; width: fit-content; padding: 7px 11px;
      background: var(--purple-soft); color: var(--purple-dark); border-radius: 999px;
      font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: 1.25px;
    }
    .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: #8c6be9; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 18px; font-size: clamp(36px, 5.3vw, 64px); line-height: 1.04; letter-spacing: -2.9px; }
    h2 { margin-bottom: 9px; font-size: clamp(25px, 3vw, 36px); line-height: 1.15; letter-spacing: -1px; }
    h3 { margin-bottom: 7px; font-size: 17px; letter-spacing: -.3px; }
    .gradient-text { color: var(--purple); }
    .muted { color: var(--muted); }
    .lead { max-width: 600px; color: #69627d; font-size: 16px; line-height: 1.75; }
    .primary-btn, .secondary-btn, .quiet-btn {
      display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 48px;
      padding: 12px 19px; border-radius: 14px; border: 1px solid transparent; cursor: pointer;
      font-size: 14px; font-weight: 800; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .primary-btn { background: linear-gradient(135deg, #8768e8, #6a4acb); color: white; box-shadow: 0 10px 22px rgba(117,85,217,.24); }
    .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 13px 27px rgba(117,85,217,.3); }
    .secondary-btn { color: var(--purple-dark); background: var(--purple-soft); border-color: #e4d9ff; }
    .secondary-btn:hover { background: #e7ddff; }
    .quiet-btn { color: #69627d; background: #fff; border-color: var(--line); }
    .quiet-btn:hover { background: #fbf9ff; }
    .button-row { display: flex; flex-wrap: wrap; align-items: center; gap: 11px; margin-top: 27px; }
    .small-note { margin-top: 13px; color: #89839b; font-size: 12px; }

    /* Welcome screen */
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr); gap: 24px; align-items: stretch; }
    .hero-copy { padding: clamp(24px, 4.5vw, 54px) clamp(20px, 4vw, 48px); }
    .hero-copy h1 { margin-top: 22px; }
    .hero-copy .lead { margin-bottom: 0; }
    .hero-art {
      min-height: 420px; position: relative; overflow: hidden; padding: 28px;
      border-radius: var(--radius-xl); border: 1px solid #ece5ff;
      background: linear-gradient(150deg, #f0eaff 0%, #faf8ff 51%, #e9f8f2 100%);
    }
    .art-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: relative; z-index: 1; }
    .art-pill { background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.95); border-radius: 999px; padding: 8px 11px; color: #65578c; font-size: 11px; font-weight: 850; }
    .art-spark { color: #9e84ec; font-size: 25px; }
    .quest-illustration { position: relative; width: 100%; max-width: 440px; height: 295px; margin: 14px auto 0; }
    .quest-illustration:before {
      content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 90px; transform: translateY(-50%) rotate(-7deg);
      border: 5px dashed #d0c1fb; border-left-color: transparent; border-radius: 60%; opacity: .9;
    }
    .mini-tile {
      position: absolute; width: 77px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      border: 1px solid #e6dcff; border-radius: 19px; background: rgba(255,255,255,.94); box-shadow: 0 12px 22px rgba(91,66,158,.11);
      transform: rotate(var(--rotation, 0deg));
    }
    .mini-tile strong { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 10px; color: white; background: var(--purple); font-size: 13px; }
    .mini-tile span { font-size: 10px; font-weight: 850; color: #776c98; }
    .mini-tile.t1 { left: 2%; top: 43%; --rotation: -8deg; }
    .mini-tile.t2 { left: 23%; top: 13%; --rotation: 6deg; }
    .mini-tile.t3 { left: 44%; top: 37%; --rotation: -5deg; }
    .mini-tile.t4 { left: 66%; top: 8%; --rotation: 7deg; }
    .mini-tile.t5 { left: 79%; top: 53%; --rotation: -6deg; }
    .mini-tile.t1 strong { background: #53aa8c; }
    .mini-tile.t3 strong { background: #8f6be8; }
    .mini-tile.t4 strong { background: #e8a54f; }
    .mini-tile.t5 strong { background: #b2a4d9; }
    .art-caption { position: absolute; right: 25px; bottom: 23px; color: #7f759b; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
    .welcome-details { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; margin-top: 23px; }
    .info-card { padding: 24px 26px; }
    .info-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .info-icon { width: 39px; height: 39px; display: grid; place-items: center; background: #f0eaff; border-radius: 13px; font-size: 19px; }
    .step-list { display: grid; gap: 13px; margin: 0; padding: 0; list-style: none; }
    .step-list li { display: flex; align-items: flex-start; gap: 12px; font-size: 13px; color: #68617b; }
    .step-num { display: grid; place-items: center; flex: 0 0 25px; width: 25px; height: 25px; border-radius: 9px; background: var(--purple-soft); color: var(--purple-dark); font-size: 11px; font-weight: 900; }
    .level-list { display: grid; gap: 10px; }
    .level-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #fbfaff; border: 1px solid #f0ebfa; }
    .level-icon { display: grid; place-items: center; flex: 0 0 38px; width: 38px; height: 38px; border-radius: 12px; background: var(--purple-soft); font-size: 18px; }
    .level-item:nth-child(2) .level-icon { background: #fff2d8; }
    .level-item:nth-child(3) .level-icon { background: #def6ed; }
    .level-item strong { display: block; font-size: 13px; }
    .level-item span { display: block; color: var(--muted); font-size: 11px; }
    .level-count { margin-left: auto; color: #7d6bb0; font-weight: 850; font-size: 12px; white-space: nowrap; }

    /* Test and result screens */
    .narrow-shell { max-width: 790px; margin: 14px auto 0; }
    .test-card { padding: clamp(22px, 5vw, 42px); }
    .screen-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .counter-pill { flex: 0 0 auto; padding: 8px 11px; border: 1px solid var(--line); background: #fff; border-radius: 999px; font-size: 12px; font-weight: 850; color: #6d6483; }
    .progress-track { width: 100%; height: 7px; border-radius: 99px; overflow: hidden; background: #f0ebfa; margin: 0 0 28px; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #9c83f0, #6b4ccd); transition: width .25s ease; }
    .question-type { display: inline-flex; padding: 6px 10px; border-radius: 8px; background: #f2edff; color: #6a51be; font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
    .question-instruction { margin: 15px 0 8px; color: var(--muted); font-size: 14px; }
    .question-prompt { margin: 0 0 23px; font-size: clamp(25px, 4vw, 38px); line-height: 1.42; letter-spacing: -.8px; font-weight: 850; overflow-wrap: anywhere; }
    .question-prompt.korean-word { font-size: clamp(42px, 7vw, 58px); color: var(--purple-dark); }
    .blank-slot { display: inline-block; min-width: 64px; border-bottom: 3px solid #ad9be9; color: #8b74d5; line-height: 1.1; }
    .answer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    .answer-option {
      display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 13px 14px; text-align: left;
      border: 1px solid #e9e3f5; border-radius: 14px; background: #fff; color: #39324d;
      cursor: pointer; font-weight: 700; font-size: 14px; transition: .16s ease;
    }
    .answer-option:hover:not(:disabled) { border-color: #b9a7ef; background: #fbf9ff; transform: translateY(-1px); }
    .answer-option:disabled { cursor: default; opacity: .76; }
    .option-letter { display: grid; place-items: center; flex: 0 0 29px; width: 29px; height: 29px; border-radius: 9px; background: #f3effb; color: #7b6aa4; font-size: 11px; font-weight: 900; }
    .answer-option:hover:not(:disabled) .option-letter { color: white; background: var(--purple); }
    .question-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 21px; padding-top: 17px; border-top: 1px solid #f0ebf7; color: #8b849b; font-size: 11px; }
    .feedback-box { margin-top: 18px; padding: 17px; border-radius: 15px; border: 1px solid transparent; }
    .feedback-box.correct { background: var(--green-soft); border-color: #c8ecdd; }
    .feedback-box.incorrect { background: var(--red-soft); border-color: #f6d9df; }
    .feedback-title { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; margin-bottom: 4px; }
    .feedback-box.correct .feedback-title { color: #176f53; }
    .feedback-box.incorrect .feedback-title { color: #a53b54; }
    .feedback-box p { margin: 5px 0 0; color: #5e586d; font-size: 13px; }
    .feedback-box .right-answer { color: #3f384f; font-weight: 800; }
    .feedback-box .retry-row { margin-top: 12px; }
    .result-card { padding: clamp(26px, 5vw, 48px); text-align: center; overflow: hidden; position: relative; }
    .result-symbol { width: 82px; height: 82px; display: grid; place-items: center; border-radius: 27px; margin: 0 auto 20px; background: linear-gradient(145deg, #efe8ff, #dff7ee); font-size: 40px; box-shadow: 0 12px 30px rgba(104,78,174,.13); }
    .result-card h2 { margin-top: 18px; }
    .result-copy { color: var(--muted); max-width: 520px; margin: 0 auto 24px; }
    .score-number { font-size: clamp(48px, 8vw, 72px); line-height: 1; color: var(--purple-dark); font-weight: 900; letter-spacing: -3px; }
    .score-sub { color: var(--muted); font-size: 12px; font-weight: 750; margin: 9px 0 20px; }
    .level-result-chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid #e6dcff; border-radius: 999px; background: #f8f4ff; color: var(--purple-dark); font-weight: 850; font-size: 13px; }
    .result-buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
    .score-breakdown { max-width: 480px; text-align: left; margin: 24px auto 0; }
    .score-breakdown h3 { margin-bottom: 12px; }
    .score-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; margin-top: 8px; border-radius: 12px; background: #fbfaff; border: 1px solid #f0ebfa; font-size: 13px; }
    .score-row strong { color: var(--purple-dark); }

    /* Game board */
    .game-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; margin-bottom: 19px; }
    .game-heading h2 { margin: 7px 0 5px; }
    .game-heading p { color: var(--muted); font-size: 13px; margin-bottom: 0; }
    .timer-card { flex: 0 0 155px; background: #fff; border: 1px solid #e6def5; border-radius: 18px; padding: 13px 15px; box-shadow: 0 6px 18px rgba(71,48,129,.05); }
    .timer-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #79718d; font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: 1px; }
    .timer-clock { color: var(--ink); font-weight: 900; font-size: 27px; letter-spacing: -1px; font-variant-numeric: tabular-nums; margin: 3px 0 7px; }
    .timer-card.low .timer-clock { color: var(--red); }
    .timer-track { height: 5px; border-radius: 99px; background: #f0eaf8; overflow: hidden; }
    .timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #8e73e4, #70c2a3); border-radius: inherit; transition: width .25s linear; }
    .timer-card.low .timer-fill { background: #df7188; }
    .game-layout { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(340px, .95fr); gap: 20px; align-items: start; }
    .board-panel { padding: 23px; overflow: hidden; }
    .panel-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
    .panel-title-row h3 { margin: 0; }
    .tiny-label { color: #8a819f; font-size: 10px; font-weight: 850; letter-spacing: 1px; text-transform: uppercase; }
    .board-map {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(98px, auto); gap: 13px;
      padding: 8px 0 6px; position: relative;
    }
    .board-map:before {
      content: ""; position: absolute; left: 7%; right: 7%; top: 30%; height: 70px; pointer-events: none;
      border-top: 4px dashed #e2d8fb; border-radius: 50%; transform: rotate(5deg); opacity: .75;
    }
    .tile {
      min-width: 0; z-index: 1; position: relative; align-self: center; justify-self: center; width: 100%; max-width: 118px; min-height: 91px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      border: 1px solid #e5def3; border-radius: 17px; background: #fff; color: #9089a4;
      box-shadow: 0 6px 14px rgba(60,42,111,.045); transition: .2s ease;
    }
    .tile-number { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: #f0edf6; color: #8a83a0; font-weight: 900; font-size: 12px; }
    .tile-name { font-size: 10px; text-transform: uppercase; letter-spacing: .7px; font-weight: 850; }
    .tile.completed { background: #edfaf4; border-color: #cdeedf; color: #328665; }
    .tile.completed .tile-number { background: #3fa981; color: #fff; }
    .tile.current { background: linear-gradient(160deg, #f0e9ff, #fff); border: 2px solid #8e70e6; color: #5f43bb; box-shadow: 0 8px 20px rgba(117,85,217,.18); transform: translateY(-2px); }
    .tile.current .tile-number { background: #7958d5; color: #fff; }
    .tile.locked { background: #fbfaff; border-style: dashed; }
    .tile.locked .tile-number { background: #f2eff8; color: #aaa4ba; }
    .board-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f0ebf7; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; color: #827a95; font-size: 10px; font-weight: 750; }
    .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: #43ae84; }
    .legend-dot.active { background: #8968e5; }
    .legend-dot.locked { background: #ded8eb; }
    .question-card { padding: clamp(20px, 3vw, 29px); }
    .question-card .question-prompt { margin-top: 15px; font-size: clamp(23px, 3vw, 32px); }
    .question-card .question-prompt.korean-word { font-size: clamp(38px, 5vw, 49px); }
    .question-card .answer-grid { grid-template-columns: 1fr; gap: 9px; }
    .question-card .answer-option { min-height: 51px; padding: 10px 12px; font-size: 13px; }
    .game-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; color: #8a839b; font-size: 11px; }
    .game-footer strong { color: #62597d; }

    .toast-message { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; max-width: calc(100% - 30px); border-radius: 13px; padding: 12px 16px; background: #302746; color: white; font-size: 13px; font-weight: 750; box-shadow: 0 12px 30px rgba(32,20,61,.24); }
    .footer-note { max-width: 1240px; margin: -35px auto 25px; padding: 0 26px; text-align: center; color: #a09aae; font-size: 11px; }
    .confetti-row { font-size: 22px; letter-spacing: 5px; margin-bottom: 10px; }
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero-art { min-height: 365px; }
      .quest-illustration { max-width: 450px; height: 260px; }
      .welcome-details { grid-template-columns: 1fr; }
      .game-layout { grid-template-columns: 1fr; }
      .board-map { grid-auto-rows: minmax(94px, auto); }
      .tile { max-width: 130px; }
    }
    @media (max-width: 620px) {
      .site-header { padding: 15px 15px 6px; }
      .page-shell { padding: 13px 15px 48px; }
      .brand-mark { width: 40px; height: 40px; border-radius: 13px; }
      .brand-name { font-size: 16px; }
      .brand-sub { font-size: 9px; letter-spacing: 1.1px; }
      .sound-toggle { width: 42px; height: 42px; padding: 0; justify-content: center; }
      .sound-toggle .sound-label { display: none; }
      .hero-copy { padding: 27px 22px; }
      h1 { letter-spacing: -1.9px; }
      .lead { font-size: 14px; }
      .hero-art { min-height: 335px; padding: 19px; }
      .quest-illustration { height: 245px; margin-top: 5px; }
      .mini-tile { width: 64px; height: 70px; border-radius: 16px; }
      .mini-tile.t1 { left: 0%; top: 45%; }
      .mini-tile.t2 { left: 20%; top: 13%; }
      .mini-tile.t3 { left: 42%; top: 39%; }
      .mini-tile.t4 { left: 65%; top: 9%; }
      .mini-tile.t5 { left: 78%; top: 54%; }
      .art-caption { right: 18px; bottom: 16px; font-size: 9px; }
      .info-card { padding: 21px; }
      .test-card { padding: 22px 17px; }
      .screen-title-row { gap: 10px; }
      .screen-title-row h2 { font-size: 25px; }
      .counter-pill { font-size: 10px; padding: 7px 9px; }
      .answer-grid { grid-template-columns: 1fr; }
      .question-prompt { font-size: 26px; }
      .question-prompt.korean-word { font-size: 43px; }
      .question-foot { font-size: 10px; }
      .result-card { padding: 29px 18px; }
      .game-heading { align-items: center; gap: 12px; }
      .game-heading h2 { font-size: 24px; }
      .game-heading p { font-size: 11px; max-width: 225px; }
      .timer-card { flex-basis: 112px; padding: 10px; border-radius: 15px; }
      .timer-clock { font-size: 23px; }
      .timer-top { font-size: 9px; }
      .board-panel { padding: 16px 12px; }
      .board-map { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(85px, auto); gap: 8px; }
      .board-map:before { top: 26%; left: 6%; right: 6%; height: 55px; }
      .tile { min-height: 78px; max-width: 105px; border-radius: 14px; }
      .tile-number { width: 27px; height: 27px; border-radius: 9px; }
      .tile-name { font-size: 9px; }
      .question-card { padding: 19px 15px; }
      .question-card .question-prompt { font-size: 24px; }
      .question-card .question-prompt.korean-word { font-size: 38px; }
      .button-row .primary-btn, .button-row .secondary-btn, .button-row .quiet-btn,
      .result-buttons .primary-btn, .result-buttons .secondary-btn, .result-buttons .quiet-btn { width: 100%; }
      .footer-note { margin-top: -23px; padding: 0 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }

  <main class="page-shell" id="app" aria-live="polite"></main>
  <div class="footer-note">A small daily quest for your Korean learning journey.</div>

  <script>
  (() => {
    'use strict';

    const $ = (selector, root = document) => root.querySelector(selector);
    const app = $('#app');
    const soundToggle = $('#soundToggle');
    const soundIcon = $('#soundIcon');
    const soundLabel = $('#soundLabel');
    const shuffle = (items) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };
    const escapeHTML = (value) => String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const makeQuestion = (id, type, prompt, answer, wrongAnswers, explanation) => ({
      id, type, prompt, answer, choices: [answer, ...wrongAnswers], explanation
    });
    const word = (id, korean, answer, wrong, explanation) => makeQuestion(id, 'word', korean, answer, wrong, explanation);
    const fill = (id, sentence, answer, wrong, explanation) => makeQuestion(id, 'fill', sentence, answer, wrong, explanation);
    const translate = (id, sentence, answer, wrong, explanation) => makeQuestion(id, 'translate', sentence, answer, wrong, explanation);

    // The placement bank is separate from the three gameplay banks.
    const placementPools = {
      word: [
        word('p-w1', '사과', 'Apple', ['Potato', 'Banana', 'Peach'], '사과 means “apple.”'),
        word('p-w2', '배우다', 'To learn', ['To forget', 'To wait', 'To sell'], '배우다 means “to learn.”'),
        word('p-w3', '어제', 'Yesterday', ['Tomorrow', 'Today', 'Next week'], '어제 means “yesterday.”'),
        word('p-w4', '조용하다', 'To be quiet', ['To be busy', 'To be expensive', 'To be warm'], '조용하다 means “to be quiet.”'),
        word('p-w5', '문', 'Door', ['Window', 'Floor', 'Chair'], '문 means “door.”'),
        word('p-w6', '빠르다', 'To be fast', ['To be slow', 'To be difficult', 'To be cold'], '빠르다 means “to be fast.”'),
        word('p-w7', '시장', 'Market', ['Airport', 'Library', 'Restaurant'], '시장 means “market.”'),
        word('p-w8', '쉬다', 'To rest', ['To run', 'To cook', 'To write'], '쉬다 means “to rest.”'),
        word('p-w9', '비', 'Rain', ['Snow', 'Wind', 'Cloud'], '비 means “rain.”'),
        word('p-w10', '의자', 'Chair', ['Desk', 'Door', 'Clock'], '의자 means “chair.”')
      ],
      fill: [
        fill('p-f1', '저는 아침에 빵을 _____.', '먹어요', ['읽어요', '만나요', '자요'], '먹어요 means “eat.” The sentence means “I eat bread in the morning.”'),
        fill('p-f2', '친구를 만나러 카페에 _____.', '가요', ['와요', '마셔요', '써요'], '가요 means “go.”'),
        fill('p-f3', '비가 와서 우산을 _____.', '써요', ['읽어요', '먹어요', '만들어요'], '써요 is used with 우산 to mean “use/carry an umbrella.”'),
        fill('p-f4', '한국어를 더 잘하고 싶어서 매일 _____.', '공부해요', ['운동해요', '요리해요', '청소해요'], '공부해요 means “study.”'),
        fill('p-f5', '시험이 있어서 도서관에서 _____.', '공부해요', ['수영해요', '쇼핑해요', '운전해요'], '공부해요 means “study,” which fits a library and an exam.'),
        fill('p-f6', '버스에서 내려서 학교까지 _____.', '걸어요', ['빌려요', '열어요', '닫아요'], '걸어요 means “walk.”'),
        fill('p-f7', '목이 말라서 물을 _____.', '마셔요', ['입어요', '읽어요', '타요'], '마셔요 means “drink.”'),
        fill('p-f8', '수업이 아홉 시에 _____.', '시작해요', ['도착해요', '빌려요', '쉬어요'], '시작해요 means “starts/begins.”')
      ],
      translate: [
        translate('p-t1', '오늘은 날씨가 정말 좋아요.', 'The weather is really nice today.', ['The food is really delicious today.', 'It is very cold yesterday.', 'Tomorrow the weather will be bad.'], '오늘은 means “today,” and 날씨 means “weather.”'),
        translate('p-t2', '저는 주말에 친구를 만날 거예요.', 'I will meet a friend on the weekend.', ['I met my teacher at school yesterday.', 'I will study Korean every morning.', 'My friend is waiting at the station.'], '만날 거예요 expresses a future plan: “will meet.”'),
        translate('p-t3', '물을 많이 마셔야 해요.', 'You should drink a lot of water.', ['You should buy a bottle of milk.', 'You must eat a lot of rice.', 'You can drink coffee tomorrow.'], '마셔야 해요 means “should drink” or “need to drink.”'),
        translate('p-t4', '수업이 끝난 후에 집에 가요.', 'I go home after class ends.', ['I go to class before going home.', 'I study at home during class.', 'I will meet a friend after dinner.'], '끝난 후에 means “after finishing/after it ends.”'),
        translate('p-t5', '잠깐만 기다려 주세요.', 'Please wait a moment.', ['Please speak a little louder.', 'Please open the door now.', 'Please sit here tomorrow.'], '기다려 주세요 is a polite way to say “please wait.”'),
        translate('p-t6', '이 음식은 조금 매워요.', 'This food is a little spicy.', ['This drink is very sweet.', 'That food is too expensive.', 'This room is a little cold.'], '음식 means “food,” and 매워요 means “is spicy.”')
      ]
    };

    const basicWords = [
      word('b-w1', '학교', 'School', ['Hospital', 'Station', 'Market'], '학교 means “school.”'),
      word('b-w2', '물', 'Water', ['Milk', 'Bread', 'Juice'], '물 means “water.”'),
      word('b-w3', '친구', 'Friend', ['Teacher', 'Neighbor', 'Customer'], '친구 means “friend.”'),
      word('b-w4', '가족', 'Family', ['Classroom', 'Company', 'Homework'], '가족 means “family.”'),
      word('b-w5', '책', 'Book', ['Bag', 'Pencil', 'Phone'], '책 means “book.”'),
      word('b-w6', '먹다', 'To eat', ['To sleep', 'To drink', 'To read'], '먹다 means “to eat.”'),
      word('b-w7', '마시다', 'To drink', ['To buy', 'To listen', 'To meet'], '마시다 means “to drink.”'),
      word('b-w8', '오늘', 'Today', ['Yesterday', 'Tomorrow', 'Weekend'], '오늘 means “today.”'),
      word('b-w9', '내일', 'Tomorrow', ['Last week', 'Yesterday', 'Last night'], '내일 means “tomorrow.”'),
      word('b-w10', '집', 'Home / house', ['Station', 'Classroom', 'Store'], '집 means “home” or “house.”'),
      word('b-w11', '가다', 'To go', ['To come', 'To wait', 'To stay'], '가다 means “to go.”'),
      word('b-w12', '좋아하다', 'To like', ['To hate', 'To forget', 'To rest'], '좋아하다 means “to like.”'),
      word('b-w13', '공원', 'Park', ['Bank', 'Airport', 'Library'], '공원 means “park.”'),
      word('b-w14', '시간', 'Time', ['Price', 'Weather', 'Address'], '시간 means “time.”'),
      word('b-w15', '맛있다', 'To be delicious', ['To be expensive', 'To be cold', 'To be busy'], '맛있다 means “to be delicious.”'),
      word('b-w16', '안전하다', 'To be safe', ['To be noisy', 'To be difficult', 'To be slow'], '안전하다 means “to be safe.”')
    ];

    const intermediateWords = [
      word('i-w1', '준비하다', 'To prepare', ['To forget', 'To borrow', 'To arrive'], '준비하다 means “to prepare.”'),
      word('i-w2', '약속', 'Appointment / promise', ['Weather', 'Homework', 'Experience'], '약속 can mean an appointment or a promise.'),
      word('i-w3', '빌리다', 'To borrow', ['To lend', 'To choose', 'To explain'], '빌리다 means “to borrow.”'),
      word('i-w4', '도착하다', 'To arrive', ['To depart', 'To decide', 'To change'], '도착하다 means “to arrive.”'),
      word('i-w5', '필요하다', 'To be necessary / to need', ['To be late', 'To be quiet', 'To be delicious'], '필요하다 means “to be necessary” or “to need.”'),
      word('i-w6', '경험', 'Experience', ['Appointment', 'Schedule', 'Reason'], '경험 means “experience.”'),
      word('i-w7', '선택하다', 'To choose', ['To explain', 'To contact', 'To prepare'], '선택하다 means “to choose.”'),
      word('i-w8', '설명하다', 'To explain', ['To reserve', 'To borrow', 'To arrive'], '설명하다 means “to explain.”'),
      word('i-w9', '편리하다', 'To be convenient', ['To be dangerous', 'To be expensive', 'To be crowded'], '편리하다 means “to be convenient.”'),
      word('i-w10', '걱정하다', 'To worry', ['To celebrate', 'To recommend', 'To register'], '걱정하다 means “to worry.”'),
      word('i-w11', '결정하다', 'To decide', ['To understand', 'To arrive', 'To return'], '결정하다 means “to decide.”'),
      word('i-w12', '연락하다', 'To contact', ['To exercise', 'To order food', 'To clean'], '연락하다 means “to contact.”'),
      word('i-w13', '예약하다', 'To make a reservation', ['To cancel a class', 'To borrow a book', 'To explain a rule'], '예약하다 means “to make a reservation.”'),
      word('i-w14', '확인하다', 'To check / confirm', ['To forget', 'To leave behind', 'To cook'], '확인하다 means “to check” or “to confirm.”')
    ];

    const intermediateFills = [
      fill('i-f1', '저는 매일 아침에 물을 _____.', '마셔요', ['읽어요', '만나요', '자요'], '마셔요 means “drink.”'),
      fill('i-f2', '수업은 아홉 시에 _____.', '시작해요', ['도착해요', '빌려요', '쉬어요'], '시작해요 means “starts.”'),
      fill('i-f3', '주말에는 친구를 _____.', '만나요', ['입어요', '열어요', '출발해요'], '만나요 means “meet.”'),
      fill('i-f4', '배가 고파서 김밥을 _____.', '먹어요', ['읽어요', '걸어요', '빌려요'], '먹어요 means “eat.”'),
      fill('i-f5', '도서관에서 책을 _____.', '읽어요', ['마셔요', '타요', '예약해요'], '읽어요 means “read.”'),
      fill('i-f6', '날씨가 추워서 코트를 _____.', '입어요', ['먹어요', '만나요', '빌려요'], '입어요 means “wear” for clothing.'),
      fill('i-f7', '한국어를 잘하고 싶어서 매일 _____.', '공부해요', ['청소해요', '운전해요', '수영해요'], '공부해요 means “study.”'),
      fill('i-f8', '약속 시간보다 10분 일찍 _____.', '도착했어요', ['빌렸어요', '설명했어요', '예약했어요'], '도착했어요 means “arrived.”'),
      fill('i-f9', '길을 몰라서 사람에게 _____.', '물어봐요', ['요리해요', '청소해요', '운동해요'], '물어봐요 means “ask.”'),
      fill('i-f10', '내일까지 숙제를 다 _____.', '해야 해요', ['마셔야 해요', '입어야 해요', '타야 해요'], '해야 해요 means “have to do.”'),
      fill('i-f11', '몸이 아파서 병원에 _____.', '갔어요', ['읽었어요', '빌렸어요', '입었어요'], '갔어요 means “went.”'),
      fill('i-f12', '친구에게 생일 선물을 _____.', '줬어요', ['읽었어요', '마셨어요', '도착했어요'], '줬어요 means “gave.”'),
      fill('i-f13', '시험을 준비하려고 도서관에서 _____.', '공부해요', ['수영해요', '운전해요', '요리해요'], '공부해요 means “study.”'),
      fill('i-f14', '회의 전에 필요한 자료를 _____.', '준비해요', ['마셔요', '걸어요', '입어요'], '준비해요 means “prepare.”')
    ];

    const highWords = [
      word('h-w1', '효율적이다', 'To be efficient', ['To be uncertain', 'To be crowded', 'To be nervous'], '효율적이다 means “to be efficient.”'),
      word('h-w2', '미루다', 'To postpone', ['To confirm', 'To borrow', 'To recommend'], '미루다 means “to postpone” or “put off.”'),
      word('h-w3', '제안하다', 'To suggest / propose', ['To attend', 'To register', 'To apologize'], '제안하다 means “to suggest” or “to propose.”'),
      word('h-w4', '해결하다', 'To solve / resolve', ['To prepare', 'To announce', 'To transfer'], '해결하다 means “to solve” or “to resolve.”'),
      word('h-w5', '검토하다', 'To review / examine', ['To postpone', 'To borrow', 'To celebrate'], '검토하다 means “to review” or “to examine.”'),
      word('h-w6', '부담스럽다', 'To feel burdensome', ['To feel convenient', 'To be delicious', 'To be accurate'], '부담스럽다 describes something that feels burdensome or overwhelming.'),
      word('h-w7', '정확하다', 'To be accurate', ['To be expensive', 'To be late', 'To be quiet'], '정확하다 means “to be accurate.”'),
      word('h-w8', '협력하다', 'To cooperate', ['To postpone', 'To misunderstand', 'To register'], '협력하다 means “to cooperate.”'),
      word('h-w9', '변경하다', 'To change / modify', ['To attend', 'To borrow', 'To refuse'], '변경하다 means “to change” or “modify.”'),
      word('h-w10', '확보하다', 'To secure / obtain', ['To explain', 'To postpone', 'To apologize'], '확보하다 means “to secure” or “obtain.”'),
      word('h-w11', '참석하다', 'To attend', ['To suggest', 'To solve', 'To check out a book'], '참석하다 means “to attend,” often a meeting or event.'),
      word('h-w12', '부족하다', 'To be insufficient / lacking', ['To be comfortable', 'To be correct', 'To be crowded'], '부족하다 means “to be insufficient” or “lacking.”')
    ];

    const highFills = [
      fill('h-f1', '회의 전에 필요한 자료를 미리 _____.', '준비해요', ['미뤄요', '빌려요', '환승해요'], '준비해요 means “prepare.”'),
      fill('h-f2', '일정이 바뀌어서 약속 시간을 _____.', '변경했어요', ['참석했어요', '해결했어요', '확보했어요'], '변경했어요 means “changed.”'),
      fill('h-f3', '문제가 생기면 함께 해결 방법을 _____.', '찾아요', ['입어요', '마셔요', '환승해요'], '찾아요 means “look for” or “find.”'),
      fill('h-f4', '새로운 아이디어를 팀원들에게 _____.', '제안했어요', ['도착했어요', '미뤘어요', '빌렸어요'], '제안했어요 means “suggested.”'),
      fill('h-f5', '오늘은 몸이 좋지 않아 회의에 _____.', '참석하지 못해요', ['참석해요', '확보해요', '변경해요'], '참석하지 못해요 means “cannot attend.”'),
      fill('h-f6', '시간이 부족해서 보고서를 내일까지 _____.', '제출해야 해요', ['환승해야 해요', '미뤄야 해요', '참석해야 해요'], '제출해야 해요 means “have to submit.”'),
      fill('h-f7', '안내문을 읽고 내용을 정확하게 _____.', '이해했어요', ['연기했어요', '확보했어요', '참석했어요'], '이해했어요 means “understood.”'),
      fill('h-f8', '온라인으로 신청서를 _____.', '작성했어요', ['협력했어요', '도착했어요', '부족했어요'], '작성했어요 means “filled out” or “wrote.”'),
      fill('h-f9', '더 좋은 방법인지 다시 _____.', '검토해요', ['마셔요', '빌려요', '환승해요'], '검토해요 means “review” or “examine.”'),
      fill('h-f10', '일정이 변경되면 미리 _____.', '알려 주세요', ['입어 주세요', '먹어 주세요', '빌려 주세요'], '알려 주세요 means “please let me know.”'),
      fill('h-f11', '문제가 예상보다 복잡해서 시간이 더 _____.', '필요해요', ['참석해요', '제안해요', '환승해요'], '필요해요 means “is needed.”'),
      fill('h-f12', '회의에 참석할 수 있는지 먼저 _____.', '확인해 주세요', ['준비해 주세요', '변경해 주세요', '미뤄 주세요'], '확인해 주세요 means “please check/confirm.”')
    ];

    const highTranslations = [
      translate('h-t1', '이번 주 안에 서류를 제출해야 합니다.', 'I have to submit the documents by the end of this week.', ['I submitted the documents last week.', 'I need to collect documents next month.', 'The documents will arrive tomorrow.'], '이번 주 안에 means “by the end of this week,” and 제출해야 합니다 means “must submit.”'),
      translate('h-t2', '예상보다 시간이 오래 걸렸어요.', 'It took longer than expected.', ['The schedule was easier than expected.', 'I arrived earlier than expected.', 'The meeting will take a short time.'], '예상보다 means “than expected,” and 오래 걸렸어요 means “took a long time.”'),
      translate('h-t3', '일정이 변경되면 미리 알려 주세요.', 'Please let me know in advance if the schedule changes.', ['Please cancel the schedule before it changes.', 'Let me know after the meeting ends.', 'Please change the schedule next week.'], '미리 알려 주세요 means “please let me know in advance.”'),
      translate('h-t4', '이 문제를 해결하기 위해 함께 논의했어요.', 'We discussed it together to solve this problem.', ['We postponed the meeting because of this problem.', 'We solved the problem without talking.', 'We discussed a new schedule for next month.'], '해결하기 위해 means “in order to solve,” and 논의했어요 means “discussed.”'),
      translate('h-t5', '잠시 기다려 주시면 감사하겠습니다.', 'I would appreciate it if you could wait for a moment.', ['I would appreciate it if you could leave now.', 'Please explain it one more time.', 'I am sorry that I arrived late.'], 'This is a polite expression asking someone to wait briefly.'),
      translate('h-t6', '회의에 참석할 수 있는지 확인해 주세요.', 'Please check whether you can attend the meeting.', ['Please change the meeting time for me.', 'Please explain what happened at the meeting.', 'Please prepare the meeting room.'], '참석할 수 있는지 asks whether someone can attend.'),
      translate('h-t7', '불편을 드려서 죄송합니다.', 'I am sorry for the inconvenience.', ['Thank you for your cooperation.', 'I am happy about the change.', 'Please let me know in advance.'], '불편을 드려서 죄송합니다 is a polite apology for causing inconvenience.'),
      translate('h-t8', '가능한 다른 방법을 찾아보겠습니다.', 'I will look for another possible method.', ['I will explain the same method again.', 'I have already chosen the easiest method.', 'I will postpone the method until tomorrow.'], '찾아보겠습니다 is a polite future form meaning “I will look for.”'),
      translate('h-t9', '설명해 주신 내용을 다시 검토했어요.', 'I reviewed what you explained again.', ['I forgot the explanation immediately.', 'I will explain the details tomorrow.', 'I asked you to change the explanation.'], '검토했어요 means “reviewed,” and 다시 means “again.”'),
      translate('h-t10', '그 일은 생각보다 부담스럽지 않았어요.', 'That task was not as burdensome as I expected.', ['That task was more difficult than I expected.', 'I postponed the task until next week.', 'That task was completed earlier than expected.'], '부담스럽지 않았어요 means “was not burdensome.”'),
      translate('h-t11', '필요한 서류를 모두 준비했습니다.', 'I prepared all the required documents.', ['I forgot to bring the required documents.', 'I need to submit the documents next week.', 'I changed all the documents.'], '필요한 서류 means “required documents,” and 준비했습니다 means “prepared.”'),
      translate('h-t12', '길이 막혀서 약속 시간에 늦을 것 같아요.', 'I think I will be late for the appointment because of traffic.', ['I think I will arrive early because the road is clear.', 'I cancelled the appointment because of the weather.', 'The appointment was moved to another day.'], '길이 막혀서 means “because of traffic,” and 늦을 것 같아요 means “I think I will be late.”')
    ];

    const levelConfig = {
      basic: { name: 'Basic', icon: '🌱', count: 6, description: 'Familiar words and everyday Korean.', pools: [{pool: basicWords, count: 6}] },
      intermediate: { name: 'Intermediate', icon: '🌿', count: 8, description: 'More vocabulary and missing-word sentences.', pools: [{pool: intermediateWords, count: 4}, {pool: intermediateFills, count: 4}] },
      high: { name: 'High', icon: '🌟', count: 10, description: 'Vocabulary, sentence building, and translation.', pools: [{pool: highWords, count: 3}, {pool: highFills, count: 3}, {pool: highTranslations, count: 4}] }
    };
    const typeLabel = {word: 'Word meaning', fill: 'Complete the sentence', translate: 'Sentence translation'};
    const typeInstruction = {
      word: 'Choose the correct English meaning of this Korean word.',
      fill: 'Choose the Korean word or phrase that completes the sentence.',
      translate: 'Choose the correct English translation of this Korean sentence.'
    };

    const state = {
      screen: 'welcome', soundEnabled: true, placementQuestions: [], placementIndex: 0,
      placementAnswers: [], placementScore: 0, startingLevel: 'basic', level: null,
      boardQuestions: [], currentIndex: 0, completedTiles: 0, secondsLeft: 120,
      boardScores: [], feedback: null, answerLocked: false, timerId: null,
      lastAttemptIds: {}, lastTestIds: [], runNumber: 0
    };
    let audioContext = null;
    const activeOscillators = new Set();
    let feedbackTimeout = null;
    let lastCols = null;

    function updateSoundButton() {
      soundIcon.textContent = state.soundEnabled ? '🔊' : '🔇';
      soundLabel.textContent = state.soundEnabled ? 'Sound on' : 'Sound off';
      soundToggle.setAttribute('aria-label', state.soundEnabled ? 'Turn sound off' : 'Turn sound on');
      soundToggle.setAttribute('aria-pressed', String(state.soundEnabled));
      soundToggle.title = state.soundEnabled ? 'Mute voice and sound effects' : 'Restore voice and sound effects';
    }

    function ensureAudio() {
      if (audioContext) {
        if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
        return audioContext;
      }
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      try { audioContext = new AudioCtx(); } catch (_) { audioContext = null; }
      return audioContext;
    }

    function playTone(frequency, startAt, duration, type = 'sine', volume = 0.045) {
      const ctx = ensureAudio();
      if (!ctx || !state.soundEnabled) return;
      try {
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, startAt);
        gain.gain.setValueAtTime(0.0001, startAt);
        gain.gain.exponentialRampToValueAtTime(volume, startAt + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
        oscillator.connect(gain); gain.connect(ctx.destination);
        activeOscillators.add(oscillator);
        oscillator.onended = () => {
          activeOscillators.delete(oscillator);
          try { oscillator.disconnect(); gain.disconnect(); } catch (_) {}
        };
        oscillator.start(startAt); oscillator.stop(startAt + duration + 0.02);
      } catch (_) { /* Sound is optional; keep the game usable without it. */ }
    }

    function playEffect(kind) {
      if (!state.soundEnabled) return;
      const ctx = ensureAudio();
      const now = ctx ? ctx.currentTime + 0.02 : 0;
      if (kind === 'correct') {
        if (ctx) [523.25, 659.25, 783.99].forEach((hz, i) => playTone(hz, now + i * .085, .19, 'sine', .045));
      } else if (kind === 'incorrect') {
        if (ctx) { playTone(260, now, .16, 'triangle', .027); playTone(210, now + .1, .18, 'triangle', .025); }
      } else if (kind === 'complete') {
        if (ctx) [523.25, 659.25, 783.99, 1046.5].forEach((hz, i) => playTone(hz, now + i * .1, .24, 'sine', .047));
      } else if (kind === 'lose') {
        if (ctx) { playTone(392, now, .2, 'sine', .035); playTone(329.63, now + .13, .24, 'sine', .03); }
      } else if (kind === 'victory') {
        if (ctx) [587.33, 739.99, 880, 1174.66].forEach((hz, i) => playTone(hz, now + i * .12, .31, 'sine', .05));
      }
    }

    function speak(message) {
      if (!state.soundEnabled || !('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'en-US'; utterance.rate = 0.96; utterance.pitch = 1.04; utterance.volume = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (_) { /* Keep on-screen feedback even if voice playback fails. */ }
    }

    function stopTimer() {
      if (state.timerId !== null) window.clearInterval(state.timerId);
      state.timerId = null;
    }
    function clearFeedbackTimeout() {
      if (feedbackTimeout !== null) window.clearTimeout(feedbackTimeout);
      feedbackTimeout = null;
    }
    function formatTime(seconds) {
      const safe = Math.max(0, Math.floor(seconds));
      return `${Math.floor(safe / 60)}:${String(safe % 60).padStart(2, '0')}`;
    }
    function updateTimerDisplay() {
      const label = $('#timerText');
      const fillBar = $('#timerFill');
      const card = $('#timerCard');
      if (label) label.textContent = formatTime(state.secondsLeft);
      if (fillBar) fillBar.style.width = `${Math.max(0, Math.min(100, state.secondsLeft / 120 * 100))}%`;
      if (card) card.classList.toggle('low', state.secondsLeft <= 30);
    }
    function startTimer() {
      stopTimer(); state.secondsLeft = 120; updateTimerDisplay();
      state.timerId = window.setInterval(() => {
        if (state.screen !== 'game') { stopTimer(); return; }
        state.secondsLeft = Math.max(0, state.secondsLeft - 1);
        updateTimerDisplay();
        if (state.secondsLeft <= 0) endLoss();
      }, 1000);
    }

    function cloneQuestion(question) {
      return {...question, choices: shuffle(question.choices)};
    }
    function chooseQuestions(pool, count, excludedIds = []) {
      const excluded = new Set(excludedIds);
      let candidates = shuffle(pool.filter(q => !excluded.has(q.id)));
      if (candidates.length < count) {
        const selectedIds = new Set(candidates.map(q => q.id));
        candidates = candidates.concat(shuffle(pool.filter(q => !selectedIds.has(q.id))));
      }
      return candidates.slice(0, count).map(cloneQuestion);
    }
    function buildPlacementTest() {
      const exclude = state.lastTestIds;
      const questions = [
        ...chooseQuestions(placementPools.word, 4, exclude),
        ...chooseQuestions(placementPools.fill, 3, exclude),
        ...chooseQuestions(placementPools.translate, 3, exclude)
      ];
      state.placementQuestions = shuffle(questions);
      state.lastTestIds = state.placementQuestions.map(q => q.id);
      state.placementIndex = 0;
      state.placementAnswers = [];
      state.placementScore = 0;
    }
    function buildBoardQuestions(level) {
      const config = levelConfig[level];
      const excluded = state.lastAttemptIds[level] || [];
      let result = [];
      const thisAttemptIds = [];
      for (const entry of config.pools) {
        const selected = chooseQuestions(entry.pool, entry.count, excluded);
        result = result.concat(selected);
        thisAttemptIds.push(...selected.map(q => q.id));
      }
      state.lastAttemptIds[level] = thisAttemptIds;
      return shuffle(result);
    }

    function beginNewRun() {
      stopTimer(); clearFeedbackTimeout();
      state.boardScores = []; state.level = null; state.boardQuestions = [];
      state.currentIndex = 0; state.completedTiles = 0; state.secondsLeft = 120;
      state.feedback = null; state.answerLocked = false;
      state.runNumber += 1;
    }
    function startPlacement() {
      beginNewRun();
      buildPlacementTest();
      state.screen = 'placement';
      render(true);
    }
    function enterAssignedLevel() { startLevel(state.startingLevel); }
    function startLevel(level) {
      stopTimer(); clearFeedbackTimeout();
      state.level = level;
      state.boardQuestions = buildBoardQuestions(level);
      state.currentIndex = 0; state.completedTiles = 0;
      state.feedback = null; state.answerLocked = false;
      state.secondsLeft = 120;
      state.screen = 'game';
      render(true);
      startTimer();
      updateTimerDisplay();
    }
    function restartLevel() {
      if (!state.level) return;
      // buildBoardQuestions excludes the previous attempt's IDs when possible.
      startLevel(state.level);
    }
    function returnToWelcome() {
      beginNewRun();
      state.screen = 'welcome';
      render(true);
    }

    function answerPlacement(optionIndex) {
      if (state.screen !== 'placement') return;
      const question = state.placementQuestions[state.placementIndex];
      if (!question || state.placementAnswers[state.placementIndex] !== undefined) return;
      state.placementAnswers[state.placementIndex] = question.choices[optionIndex];
      state.placementIndex += 1;
      if (state.placementIndex >= state.placementQuestions.length) {
        state.placementScore = state.placementQuestions.reduce((score, q, i) => score + (state.placementAnswers[i] === q.answer ? 1 : 0), 0);
        state.startingLevel = state.placementScore <= 4 ? 'basic' : state.placementScore <= 7 ? 'intermediate' : 'high';
        state.screen = 'placementResult';
      }
      render(state.screen === 'placementResult');
    }

    function answerGame(optionIndex) {
      if (state.screen !== 'game' || state.answerLocked) return;
      const question = state.boardQuestions[state.currentIndex];
      if (!question || !question.choices[optionIndex]) return;
      const selected = question.choices[optionIndex];
      state.answerLocked = true;
      const answeredIndex = state.currentIndex;
      if (selected === question.answer) {
        state.completedTiles = Math.max(state.completedTiles, answeredIndex + 1);
        const isFinalTile = answeredIndex === state.boardQuestions.length - 1;
        state.feedback = {kind: 'correct', question, tileIndex: answeredIndex};
        playEffect(isFinalTile ? 'complete' : 'correct');
        speak(isFinalTile ? 'Great job! Board complete!' : 'Great job! Correct!');
        if (isFinalTile) {
          stopTimer();
        } else {
          state.currentIndex += 1;
        }
        render();
        feedbackTimeout = window.setTimeout(() => {
          feedbackTimeout = null;
          if (state.screen !== 'game') return;
          state.feedback = null; state.answerLocked = false;
          if (isFinalTile) finishBoard();
          else render();
        }, isFinalTile ? 850 : 850);
      } else {
        state.secondsLeft = Math.max(0, state.secondsLeft - 10);
        state.feedback = {kind: 'incorrect', question, tileIndex: answeredIndex};
        playEffect('incorrect');
        speak('Try again!');
        if (state.secondsLeft <= 0) {
          updateTimerDisplay();
          endLoss();
          return;
        }
        render();
        updateTimerDisplay();
      }
    }

    function finishBoard() {
      stopTimer(); clearFeedbackTimeout();
      state.feedback = null; state.answerLocked = false;
      const score = Math.max(0, Math.min(100, Math.floor(100 * state.secondsLeft / 120)));
      state.boardScores = state.boardScores.filter(item => item.level !== state.level);
      state.boardScores.push({level: state.level, name: levelConfig[state.level].name, score});
      if (state.level === 'high') {
        state.screen = 'victory';
        render(true);
        playEffect('victory');
        speak('Woohoo! We won the game!');
      } else {
        state.screen = 'boardResult';
        render(true);
        playEffect('complete');
        speak(`${levelConfig[state.level].name} level complete! Great work!`);
      }
    }
    function endLoss() {
      if (state.screen !== 'game') return;
      stopTimer(); clearFeedbackTimeout();
      state.secondsLeft = 0; state.feedback = null; state.answerLocked = true;
      state.screen = 'loss';
      render(true);
      playEffect('lose');
      speak("It's okay. Try again.");
    }

    function selectedLevelDescription(level) {
      if (level === 'basic') return 'You’ll start with familiar Korean words. Clear 6 tiles to unlock Intermediate.';
      if (level === 'intermediate') return 'You’ll practise harder words and missing-word sentences. Clear 8 tiles to unlock High.';
      return 'You’re ready for the High board. Answer 10 challenging questions to win the game.';
    }
    function levelChip(level) {
      const cfg = levelConfig[level];
      return `<span class="level-result-chip">${cfg.icon} Starting level: ${cfg.name}</span>`;
    }

    function renderWelcome() {
      return `
        <section class="hero-grid">
          <div class="hero-copy panel">
            <span class="eyebrow"><span class="dot"></span> Learn Korean, one tile at a time</span>
            <h1>Small steps.<br><span class="gradient-text">Big progress.</span></h1>
            <p class="lead">Turn Korean practice into a colorful quest. Find the right meaning, complete each challenge, and move along your path to Korean confidence.</p>
            <div class="button-row">
              <button type="button" class="primary-btn" data-action="start-game">Start Game <span aria-hidden="true">→</span></button>
            </div>
            <p class="small-note">10-question placement test · No test timer · Two minutes per board</p>
          </div>
          <div class="hero-art" aria-label="Illustration of a winding vocabulary quest path">
            <div class="art-top"><span class="art-pill">YOUR KOREAN QUEST</span><span class="art-spark" aria-hidden="true">✦ ✧</span></div>
            <div class="quest-illustration" aria-hidden="true">
              <div class="mini-tile t1"><strong>✓</strong><span>WORD</span></div>
              <div class="mini-tile t2"><strong>2</strong><span>MEANING</span></div>
              <div class="mini-tile t3"><strong>3</strong><span>PHRASE</span></div>
              <div class="mini-tile t4"><strong>4</strong><span>QUEST</span></div>
              <div class="mini-tile t5"><strong>★</strong><span>GOAL</span></div>
            </div>
            <div class="art-caption">One correct answer at a time</div>
          </div>
        </section>
        <section class="welcome-details">
          <article class="info-card panel">
            <div class="info-heading"><span class="info-icon" aria-hidden="true">🧭</span><div><h3>How to play</h3><p class="muted" style="margin:0;font-size:12px">Your journey in three steps</p></div></div>
            <ol class="step-list">
              <li><span class="step-num">1</span><span><strong>Take the placement test.</strong> Answer 10 questions at your own pace to find your starting level.</span></li>
              <li><span class="step-num">2</span><span><strong>Follow the quest path.</strong> Pick the correct answer to complete the current tile. A wrong answer costs 10 seconds.</span></li>
              <li><span class="step-num">3</span><span><strong>Beat each board.</strong> You have two minutes per board. Complete High to finish your quest!</span></li>
            </ol>
          </article>
          <article class="info-card panel">
            <div class="info-heading"><span class="info-icon" aria-hidden="true">✨</span><div><h3>Three quest levels</h3><p class="muted" style="margin:0;font-size:12px">Start where your Korean is today</p></div></div>
            <div class="level-list">
              <div class="level-item"><span class="level-icon">🌱</span><div><strong>Basic</strong><span>Everyday Korean words</span></div><span class="level-count">6 tiles</span></div>
              <div class="level-item"><span class="level-icon">🌿</span><div><strong>Intermediate</strong><span>Words and sentence blanks</span></div><span class="level-count">8 tiles</span></div>
              <div class="level-item"><span class="level-icon">🌟</span><div><strong>High</strong><span>Vocabulary and translation</span></div><span class="level-count">10 tiles</span></div>
            </div>
          </article>
        </section>`;
    }

    function renderQuestionContent(question, number, total, mode) {
      const progress = Math.min(100, Math.round((number / total) * 100));
      const promptClass = question.type === 'word' ? 'question-prompt korean-word' : 'question-prompt';
      const prompt = escapeHTML(question.prompt).replace(/_{3,}/g, '<span class="blank-slot">&nbsp;&nbsp;&nbsp;</span>');
      const letters = ['A', 'B', 'C', 'D'];
      const disabled = mode === 'game' && state.answerLocked;
      let content = `
        <div class="screen-title-row">
          <div><span class="eyebrow"><span class="dot"></span>${mode === 'placement' ? 'Placement test' : escapeHTML(levelConfig[state.level].name + ' level')}</span><h2 style="margin-top:13px">${mode === 'placement' ? 'Find your starting level' : 'Choose the right answer'}</h2><p class="muted" style="margin:0;font-size:13px">${mode === 'placement' ? 'Answer all 10 questions. You’ll see your result at the end.' : 'Answer correctly to complete this tile and move forward.'}</p></div>
          <span class="counter-pill">${number} / ${total}</span>
        </div>
        <div class="progress-track" aria-label="Question progress"><div class="progress-fill" style="width:${progress}%"></div></div>
        <span class="question-type">${escapeHTML(typeLabel[question.type])}</span>
        <p class="question-instruction">${escapeHTML(typeInstruction[question.type])}</p>
        <h3 class="${promptClass}">${prompt}</h3>`;

      if (mode === 'placement' || (mode === 'game' && (!state.feedback || state.feedback.kind !== 'incorrect'))) {
        content += `<div class="answer-grid">${question.choices.map((choice, i) => `
          <button type="button" class="answer-option" data-action="${mode === 'placement' ? 'answer-placement' : 'answer-game'}" data-option-index="${i}" ${disabled ? 'disabled' : ''}>
            <span class="option-letter">${letters[i]}</span><span>${escapeHTML(choice)}</span>
          </button>`).join('')}</div>`;
      }

      if (mode === 'game' && state.feedback) {
        const f = state.feedback;
        if (f.kind === 'correct') {
          content += `<div class="feedback-box correct"><div class="feedback-title"><span aria-hidden="true">✓</span> Great job! Correct!</div><p>${escapeHTML(f.question.explanation)}</p><p>Tile ${f.tileIndex + 1} completed. ${f.tileIndex + 1 < total ? 'Moving to the next tile…' : 'Your board is complete!'}</p></div>`;
        } else {
          content += `<div class="feedback-box incorrect"><div class="feedback-title"><span aria-hidden="true">↻</span> Try again!</div><p class="right-answer">Correct answer: ${escapeHTML(f.question.answer)}</p><p>${escapeHTML(f.question.explanation)}</p><p>10 seconds have been deducted. Your tile remains locked until you answer correctly.</p><div class="retry-row"><button type="button" class="secondary-btn" data-action="try-again">Try Again</button></div></div>`;
        }
      }
      content += `<div class="question-foot"><span>${mode === 'placement' ? 'No timer during this test' : 'Wrong answer: −10 seconds'}</span><span>${mode === 'placement' ? 'Results appear at the end' : 'One path · No skipping'}</span></div>`;
      return content;
    }

    function renderPlacement() {
      const q = state.placementQuestions[state.placementIndex];
      return `<section class="narrow-shell"><div class="test-card panel">${renderQuestionContent(q, state.placementIndex + 1, state.placementQuestions.length, 'placement')}</div></section>`;
    }

    function renderPlacementResult() {
      const level = state.startingLevel;
      const icon = levelConfig[level].icon;
      const message = level === 'basic' ? 'We’ll build confidence with familiar Korean words.' : level === 'intermediate' ? 'You’re ready to practise more vocabulary and sentence patterns.' : 'Great result! You’re ready to tackle the High-level quest.';
      return `<section class="narrow-shell"><div class="result-card panel">
        <div class="result-symbol" aria-hidden="true">${icon}</div>
        <span class="eyebrow"><span class="dot"></span> Test complete</span>
        <h2>Your Korean quest starts here</h2>
        <div class="score-number">${state.placementScore}<span style="font-size:.42em;color:#8a81a0;letter-spacing:0"> / 10</span></div>
        <p class="score-sub">PLACEMENT TEST SCORE</p>
        ${levelChip(level)}
        <p class="result-copy" style="margin-top:18px">${message} ${escapeHTML(selectedLevelDescription(level))}</p>
        <div class="result-buttons"><button type="button" class="primary-btn" data-action="enter-level">Start ${escapeHTML(levelConfig[level].name)} Level <span aria-hidden="true">→</span></button></div>
      </div></section>`;
    }

    function getPathPositions(count, cols) {
      if (cols === 3) {
        if (count === 6) return [[0,0],[0,1],[0,2],[1,2],[1,1],[1,0]];
        if (count === 8) return [[0,0],[0,1],[0,2],[1,2],[1,1],[1,0],[2,0],[2,1]];
        return [[0,0],[0,1],[0,2],[1,2],[1,1],[1,0],[2,0],[2,1],[2,2],[3,2]];
      }
      if (count === 6) return [[0,0],[0,1],[0,2],[1,2],[1,1],[1,0]];
      if (count === 8) return [[0,0],[0,1],[0,2],[0,3],[1,3],[1,2],[1,1],[1,0]];
      return [[0,0],[0,1],[0,2],[0,3],[1,3],[1,2],[1,1],[1,0],[2,0],[2,1]];
    }
    function renderBoardMap() {
      const count = levelConfig[state.level].count;
      const mobile = window.matchMedia && window.matchMedia('(max-width: 620px)').matches;
      const cols = mobile ? 3 : 4;
      const positions = getPathPositions(count, cols);
      const tiles = Array.from({length: count}, (_, idx) => {
        const [row, col] = positions[idx];
        const isComplete = idx < state.completedTiles;
        const isCurrent = idx === state.currentIndex && !isComplete;
        const className = isComplete ? 'completed' : isCurrent ? 'current' : 'locked';
        const icon = isComplete ? '✓' : isCurrent ? '✦' : '·';
        const status = isComplete ? 'Completed' : isCurrent ? 'Current tile' : 'Locked';
        return `<div class="tile ${className}" style="grid-row:${row + 1};grid-column:${col + 1}" aria-label="Tile ${idx + 1}, ${status}">
          <span class="tile-number">${icon === '·' ? idx + 1 : icon}</span><span class="tile-name">${status}</span>
        </div>`;
      }).join('');
      const rows = Math.max(...positions.map(([r]) => r)) + 1;
      return `<div class="board-map" style="grid-template-rows:repeat(${rows}, minmax(85px, auto))">${tiles}</div>`;
    }

    function renderGame() {
      const config = levelConfig[state.level];
      const total = config.count;
      const activeFeedback = state.feedback;
      const q = activeFeedback ? activeFeedback.question : state.boardQuestions[state.currentIndex];
      const questionNumber = activeFeedback ? activeFeedback.tileIndex + 1 : state.currentIndex + 1;
      const questionPanel = renderQuestionContent(q, questionNumber, total, 'game');
      return `<section>
        <div class="game-heading">
          <div><span class="eyebrow"><span class="dot"></span>${config.icon} ${escapeHTML(config.name)} quest</span><h2>Your path is waiting</h2><p>${escapeHTML(config.description)} Complete all ${total} tiles before time runs out.</p></div>
          <div class="timer-card" id="timerCard"><div class="timer-top"><span>Time left</span><span aria-hidden="true">◷</span></div><div class="timer-clock" id="timerText">${formatTime(state.secondsLeft)}</div><div class="timer-track"><div class="timer-fill" id="timerFill" style="width:${state.secondsLeft / 120 * 100}%"></div></div></div>
        </div>
        <div class="game-layout">
          <section class="board-panel panel" aria-label="Quest board">
            <div class="panel-title-row"><h3>Quest path</h3><span class="tiny-label">${state.completedTiles} / ${total} complete</span></div>
            ${renderBoardMap()}
            <div class="board-legend"><span class="legend-item"><i class="legend-dot"></i>Completed</span><span class="legend-item"><i class="legend-dot active"></i>Current tile</span><span class="legend-item"><i class="legend-dot locked"></i>Locked</span></div>
          </section>
          <section class="question-card panel" aria-label="Current question">${questionPanel}</section>
        </div>
      </section>`;
    }

    function renderBoardResult() {
      const current = state.boardScores.find(item => item.level === state.level);
      const next = state.level === 'basic' ? 'intermediate' : 'high';
      return `<section class="narrow-shell"><div class="result-card panel">
        <div class="result-symbol" aria-hidden="true">🎉</div>
        <span class="eyebrow"><span class="dot"></span> Board complete</span>
        <h2>Lovely work, ${escapeHTML(levelConfig[state.level].name)} cleared!</h2>
        <p class="result-copy">You completed every tile on this board. Take a look at your score, then continue when you’re ready.</p>
        <div class="score-number">${current ? current.score : 0}<span style="font-size:.42em;color:#8a81a0;letter-spacing:0"> / 100</span></div>
        <p class="score-sub">${escapeHTML(levelConfig[state.level].name.toUpperCase())} BOARD SCORE</p>
        <div class="level-result-chip">🔓 Next unlocked: ${escapeHTML(levelConfig[next].name)}</div>
        <div class="result-buttons"><button type="button" class="primary-btn" data-action="continue-level">Continue to ${escapeHTML(levelConfig[next].name)} <span aria-hidden="true">→</span></button></div>
      </div></section>`;
    }

    function renderLoss() {
      const config = levelConfig[state.level];
      const done = state.completedTiles;
      return `<section class="narrow-shell"><div class="result-card panel">
        <div class="result-symbol" aria-hidden="true">🌷</div>
        <span class="eyebrow"><span class="dot"></span> Time is up</span>
        <h2>It’s okay. Try again.</h2>
        <p class="result-copy">Every attempt helps you learn. Restart ${escapeHTML(config.name)} with a fresh two-minute timer and a new set of questions of the same difficulty.</p>
        <div class="level-result-chip">${config.icon} ${escapeHTML(config.name)} · ${done} of ${config.count} tiles completed</div>
        <div class="result-buttons"><button type="button" class="primary-btn" data-action="restart-level">↻ Restart ${escapeHTML(config.name)}</button></div>
      </div></section>`;
    }

    function overallScore() {
      if (!state.boardScores.length) return 0;
      return Math.round(state.boardScores.reduce((sum, item) => sum + item.score, 0) / state.boardScores.length);
    }
    function renderVictory() {
      const rows = state.boardScores.map(item => `<div class="score-row"><span>${escapeHTML(levelConfig[item.level].icon)} ${escapeHTML(item.name)} board</span><strong>${item.score} / 100</strong></div>`).join('');
      return `<section class="narrow-shell"><div class="result-card panel">
        <div class="confetti-row" aria-hidden="true">✦ ✧ ★ ✧ ✦</div>
        <div class="result-symbol" aria-hidden="true">🏆</div>
        <span class="eyebrow"><span class="dot"></span> Quest complete</span>
        <h2>Woohoo! We won the game!</h2>
        <p class="result-copy">You cleared the High board and completed your Korean vocabulary quest. Celebrate your progress!</p>
        <div class="score-number">${overallScore()}<span style="font-size:.42em;color:#8a81a0;letter-spacing:0"> / 100</span></div>
        <p class="score-sub">OVERALL SCORE</p>
        <div class="score-breakdown"><h3>Your board scores</h3>${rows}</div>
        <div class="result-buttons"><button type="button" class="primary-btn" data-action="play-again">Play Again <span aria-hidden="true">↻</span></button></div>
      </div></section>`;
    }

    function render(scrollToTop = false) {
      updateSoundButton();
      if (state.screen === 'welcome') app.innerHTML = renderWelcome();
      else if (state.screen === 'placement') app.innerHTML = renderPlacement();
      else if (state.screen === 'placementResult') app.innerHTML = renderPlacementResult();
      else if (state.screen === 'game') app.innerHTML = renderGame();
      else if (state.screen === 'boardResult') app.innerHTML = renderBoardResult();
      else if (state.screen === 'loss') app.innerHTML = renderLoss();
      else if (state.screen === 'victory') app.innerHTML = renderVictory();
      else app.innerHTML = renderWelcome();
      lastCols = window.matchMedia && window.matchMedia('(max-width: 620px)').matches ? 3 : 4;
      if (scrollToTop) window.scrollTo({top: 0, behavior: 'auto'});
    }

    app.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button || button.disabled) return;
      const action = button.dataset.action;
      if (action === 'start-game') startPlacement();
      else if (action === 'answer-placement') answerPlacement(Number(button.dataset.optionIndex));
      else if (action === 'enter-level') enterAssignedLevel();
      else if (action === 'answer-game') answerGame(Number(button.dataset.optionIndex));
      else if (action === 'try-again') {
        if (state.screen !== 'game' || !state.feedback || state.feedback.kind !== 'incorrect') return;
        state.feedback = null; state.answerLocked = false; render();
      }
      else if (action === 'continue-level') startLevel(state.level === 'basic' ? 'intermediate' : 'high');
      else if (action === 'restart-level') restartLevel();
      else if (action === 'play-again') returnToWelcome();
    });

    soundToggle.addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      if (!state.soundEnabled) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        for (const oscillator of activeOscillators) {
          try { oscillator.stop(); } catch (_) {}
        }
        activeOscillators.clear();
      }
      if (state.soundEnabled) ensureAudio();
      updateSoundButton();
    });

    $('#brandHome').addEventListener('click', (event) => {
      event.preventDefault();
      // The brand is a navigation aid on non-game screens; it won't discard an active attempt.
      if (state.screen === 'welcome') window.scrollTo({top: 0, behavior: 'smooth'});
    });

    window.addEventListener('resize', () => {
      if (state.screen !== 'game' || !window.matchMedia) return;
      const cols = window.matchMedia('(max-width: 620px)').matches ? 3 : 4;
      if (cols !== lastCols) render();
    });

    document.addEventListener('visibilitychange', () => {
      // If a tab is hidden, the timer still counts down according to the game rules.
      if (document.hidden && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    });

    render();
  })();
  </script>
</body>
</html>
